# Import local private secrets if present (ignored by Git)
spring.config.import=optional:application-local.properties

# Database (Set SPRING_DATASOURCE_URL on Render with your PostgreSQL Internal URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petcare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Memory and Connection Pool Optimization (For 512MB RAM Containers)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Server Port (Supports cloud hosts like Render)
server.port=${PORT:8080}

# Email via Brevo or Resend HTTP API (works on Render free tier without SMTP blocks)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:2020aara@gmail.com}
resend.api.key=${RESEND_API_KEY:}
resend.from.address=${RESEND_FROM:Smart Pet Care <onboarding@resend.dev>}

# Upload size  
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Local directory fallback
app.upload.dir=uploads

# Cloudinary Configuration (Cloud Image Hosting)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# Import local private secrets if present (ignored by Git)
spring.config.import=optional:application-local.properties

# Database (Configured via application-local.properties locally or Environment Variables on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/petcare_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Memory and Connection Pool Optimization (For 512MB RAM Containers)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Server Port (Supports cloud hosts like Render)
server.port=${PORT:8080}

# Email via Resend HTTP API (replaces SMTP — works on Render free tier)
# Sign up free at https://resend.com → API Keys → create key
# Then add RESEND_API_KEY as an environment variable on Render
resend.api.key=${RESEND_API_KEY:}
resend.from.address=${RESEND_FROM:Smart Pet Care <onboarding@resend.dev>}

# Upload size  
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Local directory fallback
app.upload.dir=uploads

# Cloudinary Configuration (Cloud Image Hosting)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

